    <!-- navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-4">
  <div class="container">

    <!-- Brand -->
    <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'dashboard_page' %}">
      <i class="bi bi-search-heart me-2 text-warning"></i>
      Lost <span class="text-warning mx-1">&amp;</span> Found
    </a>

    <!-- Mobile toggle -->
    <button class="navbar-toggler border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navLink"
            aria-controls="navLink"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navLink">

      <!-- Left: main links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
        <li class="nav-item">
          <a class="nav-link px-lg-3 {% if request.resolver_match.url_name == 'dashboard_page' %}active{% endif %}"
             {% if request.resolver_match.url_name == 'dashboard_page' %}aria-current="page"{% endif %}
             href="{% url 'dashboard_page' %}">
            <i class="bi bi-grid me-1"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-lg-3" href="{% url 'submit_found_page' %}">
             Submit Found Item
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-lg-3" href="{% url 'report_lost_page' %}">
             Report Lost Item
          </a>
        </li>
      </ul>

      <!-- Search -->
      <form class="d-flex me-lg-3 mb-3 mb-lg-0" role="search">
        <div class="input-group">
          <input class="form-control bg-dark text-light border-secondary"
                 type="search"
                 name="q"
                 placeholder="Search lost or found items..."
                 aria-label="Search">
          <button class="btn btn-outline-warning" type="submit" aria-label="Submit search">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>

      <!-- Right: auth actions -->
      <div class="d-flex align-items-lg-center flex-column flex-lg-row gap-2">
        {% if user.is_authenticated %}
          <span class="navbar-text text-light d-none d-lg-inline me-2">
            <a href="{% url 'user_page' user.get_username user.id %}"> <i class="bi bi-person-circle me-1"></i>{{ user.get_username }}
          </span> </a>

          <form action="{% url 'logout_page' %}" method="POST" class="m-0">
            {% csrf_token %}
            <button class="btn btn-outline-danger w-100" type="submit">
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
          </form>

          {% if user.is_staff %}
            <a href="{% url 'admin:index' %}"><button class="btn btn-outline-primary w-100">Admin</button></a>
          {% endif %}
        {% else %}
          <a href="{% url 'login_page' %}" class="btn btn-outline-light">
            Login
          </a>
          <a href="{% url 'signup_page' %}" class="btn btn-warning fw-semibold">
            Sign up
          </a>
        {% endif %}
      </div>

    </div>
  </div>
</nav>

    
<!-- content -->
    <div class="container-fluid mt-4">
        {% block content %}

        {% endblock %}
    </div>

<!-- footer -->
    <footer class="bg-light mt-5 py-4" >
        <div class="container text-center">
        <small class="text-muted"> @2026 lost and found </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
