<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %} {% endblock %}</title>
</head>
<body>
    <!-- navbar -->
     <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-3">

        <div class="container">
            <a href="{% url 'dashboard_page' %}" class="navbar-brand"> 
                Lost And Found
            </a>

            <button 
             class="navbar-toggler"
             type = "button"
             data-bs-toggle = "collapse"
             data-bs-target = "#navLink" 
             >
            <span class="navbar-toggler-icon"></span></button>

            <div class="collapse navbar-collapse" id="navLink">

                <div class="navbar-nav ms-auto">
                    <a href="{% url 'dashboard_page' %}" class="nav-link">Dashboard</a>
                    <a href="/" class="nav-link">About</a>
                    <!-- <a href="{% url 'logout_page' %}" class="nav-link btn btn-danger">Logout</a> -->

                    {% if user.is_authenticated %}
                        <form action="{% url 'logout_page' %}" method = "POST">
                            {% csrf_token %}
                            <button class="btn btn-danger nav-link" type="submit">Logout</button>
                        </form>
                    {% else %}
                        <a href="{% url 'register_page' %}" class="btn btn-secondary">Sign in</a>
                        <a href="{% url 'login_page' %}" class="btn btn-primary">Login</a>

                    {% endif %}
                </div>
            </div>
        </div>
        
    </nav>

    {% if user.is_authenticated %}
        <p>Howdy, {{ user.username }}</p>
    {% endif %}
    
<!-- content -->
    <div class="container-fluid mt-4">
        {% block content %}

        {% endblock %}
    </div>

<!-- footer -->
    <footer class="bg-light mt-5 py-4" >
        <div class="container text-center">
        <small class="text-muted"> @2026 lost and found </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
