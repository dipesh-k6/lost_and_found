{% extends 'auth_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign up{% endblock %}

{% block content %}
    <h2 class="h4 fw-bold mb-1">Create your account</h2>
    <p class="text-secondary mb-4">It only takes a minute.</p>

    <form method="POST" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-warning fw-semibold w-100 mt-3">Sign up</button>
    </form>
{% endblock %}

{% block auth_footer %}
    Already have an account? <a href="{% url 'login_page' %}" class="link-warning">Login</a>
{% endblock %}
